name: Bug report
description: Something in Layout Lab Studio does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw, and what you expected to see instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the Challenges tab
        2. Pick "Center the card"
        3. …
    validations:
      required: true
  - type: textarea
    id: css
    attributes:
      label: Tree and CSS (if relevant)
      description: The CSS you wrote, and the elements in the tree. Paste text, not a screenshot.
      render: css
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 131 on Windows 11
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
